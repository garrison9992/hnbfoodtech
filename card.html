<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HNB FoodTech | Digital Business Card</title>
<meta name="description" content="HNB FoodTech digital business card.">

<style>
html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:#222;
    background:#fff;
    line-height:1.7;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    width:100%;
    max-width:420px;
    box-sizing:border-box;
    padding:48px 32px;
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:700;
    letter-spacing:6px;
    line-height:1.1;
    margin-bottom:8px;
}

.logo span{
    display:block;
    font-size:16px;
    letter-spacing:5px;
    margin-top:6px;
}

.tagline{
    margin:32px 0 36px;
    font-size:15px;
    font-style:italic;
    color:#555;
}

.contact{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.contact a{
    display:block;
    padding:14px 18px;
    border:1px solid #ddd;
    border-radius:4px;
    text-decoration:none;
    color:#222;
    font-size:16px;
    transition:all .2s ease;
}

.contact a:hover{
    background:#222;
    color:#fff;
    border-color:#222;
}

.label{
    display:block;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:3px;
    color:#777;
}

footer{
    margin-top:42px;
    font-size:12px;
    color:#888;
}

@media (max-width:480px){
    .card{
        padding:40px 24px;
    }

    .logo{
        font-size:36px;
    }
}
</style>
</head>

<body>

<main class="card">

    <div class="logo">
        HNB
        <span>FOODTECH</span>
    </div>

    <p class="tagline">
        Food ingredients and application solutions<br>
        for the meat and food processing industry.
    </p>

    <div class="contact">

        <a href="https://wa.me/85254626197" target="_blank">
            <span class="label">WhatsApp</span>
            +852 5462 6197
        </a>

        <a href="mailto:info@hnbfoodtech.com">
            <span class="label">Email</span>
            info@hnbfoodtech.com
        </a>

        <a href="https://hnbfoodtech.com/" target="_blank">
            <span class="label">Website</span>
            hnbfoodtech.com
        </a>

    </div>

    <footer>
        © 2026 HNB FoodTech
    </footer>

</main>

</body>
</html>
